name: Playwright Tests

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: allure-gh-pages
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright Tests and Generate Allure Report
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Checkout Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-results

          npx allure generate allure-results --clean -o allure-report

          if [ -d gh-pages ]; then
            mkdir -p allure-history
            cp -r gh-pages/. allure-history/ 2>/dev/null || true
          fi

          if [ -d allure-history ]; then
            find allure-history -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          fi

          mkdir -p allure-history
          cp -r allure-report/. allure-history/

      - name: Deploy report to GitHub Pages
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
